<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="45%" stop-color="#0c162d"/>
      <stop offset="80%" stop-color="#111c38"/>
      <stop offset="100%" stop-color="#080e1d"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#7f00ff"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38ef7d"/>
      <stop offset="100%" stop-color="#11998e"/>
    </linearGradient>

    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </linearGradient>

    <!-- Filter for soft neon glow -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="node-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #1e293b; stroke-width: 1; stroke-opacity: 0.45; }
    .telemetry-wave { fill: none; stroke: url(#primary-glow); stroke-width: 2.5; stroke-dasharray: 8 4; animation: waveFlow 25s linear infinite; }
    .trace-pulse { stroke: #00f2fe; stroke-width: 2; fill: none; opacity: 0.7; }
    .glow-orb-1 { fill: #4facfe; filter: blur(55px); opacity: 0.18; animation: floatOrb1 12s ease-in-out infinite alternate; }
    .glow-orb-2 { fill: #7f00ff; filter: blur(65px); opacity: 0.22; animation: floatOrb2 16s ease-in-out infinite alternate; }
    .badge-pill { rx: 14; ry: 14; fill: #131d35; stroke: #233554; stroke-width: 1.2; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 600; fill: #94a3b8; }
    
    @keyframes waveFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -400; }
    }
    @keyframes floatOrb1 {
      0% { cx: 200px; cy: 120px; }
      100% { cx: 450px; cy: 260px; }
    }
    @keyframes floatOrb2 {
      0% { cx: 1000px; cy: 300px; }
      100% { cx: 780px; cy: 110px; }
    }
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulseRing {
      0% { r: 6px; opacity: 0.9; }
      50% { r: 18px; opacity: 0.2; }
      100% { r: 6px; opacity: 0.9; }
    }
    .pulsing-ring { animation: pulseRing 3s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)"/>

  <!-- Dynamic Glowing Ambient Orbs (Background layer) -->
  <circle class="glow-orb-1" cx="240" cy="140" r="140"/>
  <circle class="glow-orb-2" cx="960" cy="280" r="170"/>

  <!-- Tech Grid Background -->
  <g class="grid-layer">
    <line x1="0" y1="70" x2="1200" y2="70" class="grid-line" />
    <line x1="0" y1="140" x2="1200" y2="140" class="grid-line" />
    <line x1="0" y1="210" x2="1200" y2="210" class="grid-line" />
    <line x1="0" y1="280" x2="1200" y2="280" class="grid-line" />
    <line x1="0" y1="350" x2="1200" y2="350" class="grid-line" />

    <line x1="150" y1="0" x2="150" y2="420" class="grid-line" />
    <line x1="350" y1="0" x2="350" y2="420" class="grid-line" />
    <line x1="550" y1="0" x2="550" y2="420" class="grid-line" />
    <line x1="750" y1="0" x2="750" y2="420" class="grid-line" />
    <line x1="950" y1="0" x2="950" y2="420" class="grid-line" />
    <line x1="1100" y1="0" x2="1100" y2="420" class="grid-line" />
  </g>

  <!-- Dynamic Animated Telemetry / Performance Metric Wave -->
  <path d="M 0,340 Q 180,310 320,345 T 640,320 T 920,355 T 1200,330" fill="none" stroke="rgba(0, 242, 254, 0.12)" stroke-width="6"/>
  <path class="telemetry-wave" d="M 0,340 Q 180,310 320,345 T 640,320 T 920,355 T 1200,330"/>

  <path d="M 0,380 C 250,350 450,400 750,360 C 950,330 1100,370 1200,365" fill="none" stroke="rgba(127, 0, 255, 0.25)" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Performance Pulse Nodes (Subtle Background Dynamics) -->
  <g transform="translate(1030, 80)">
    <circle cx="0" cy="0" r="16" fill="rgba(0, 242, 254, 0.08)" class="pulsing-ring"/>
    <circle cx="0" cy="0" r="5" fill="#00f2fe" filter="url(#node-glow)"/>
    <text x="14" y="4" font-family="-apple-system, sans-serif" font-size="11" fill="#38ef7d" font-weight="700">99.99% UPTIME</text>
  </g>

  <g transform="translate(100, 360)">
    <circle cx="0" cy="0" r="14" fill="rgba(127, 0, 255, 0.1)" class="pulsing-ring"/>
    <circle cx="0" cy="0" r="4.5" fill="#a855f7" filter="url(#node-glow)"/>
    <text x="14" y="4" font-family="-apple-system, sans-serif" font-size="11" fill="#c084fc" font-weight="600">&lt; 12ms p99 TRACE</text>
  </g>

  <!-- Foreground Main Headers & Content (Guaranteed Foreground Visibility) -->
  <g transform="translate(80, 85)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="260" height="28" rx="14" fill="#13203c" stroke="#2563eb" stroke-width="1.2"/>
    <circle cx="16" cy="14" r="4.5" fill="#00f2fe"/>
    <text x="30" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.2">ENTERPRISE OBSERVABILITY</text>

    <!-- Main Title -->
    <text x="0" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Peak Performance <tspan fill="url(#primary-glow)">Optimization</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18.5" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
      Curated Landscape of Enterprise APM, Distributed Tracing &amp; Self-Hosted Observability Backends
    </text>

    <!-- Interactive / Feature Pills Bar -->
    <g transform="translate(0, 155)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="34" class="badge-pill"/>
        <text x="18" y="21.5" class="badge-text">⚡ Distributed Tracing</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(192, 0)">
        <rect width="200" height="34" class="badge-pill"/>
        <text x="18" y="21.5" class="badge-text">📊 Enterprise APM Suites</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(404, 0)">
        <rect width="200" height="34" class="badge-pill"/>
        <text x="18" y="21.5" class="badge-text">🔭 OpenTelemetry &amp; OTLP</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(616, 0)">
        <rect width="185" height="34" class="badge-pill"/>
        <text x="18" y="21.5" class="badge-text">🛡️ High-Throughput OLAP</text>
      </g>
      <!-- Pill 5 -->
      <g transform="translate(813, 0)">
        <rect width="170" height="34" class="badge-pill"/>
        <text x="18" y="21.5" class="badge-text">💰 Transparent TCO</text>
      </g>
    </g>

    <!-- Bottom Highlights -->
    <g transform="translate(0, 222)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" font-weight="500">
        ⭐ Verified Star Metrics &#160;•&#160; 🏷️ Granular Tier Pricing &#160;•&#160; 🎁 Detailed Free Limits &#160;•&#160; 🚀 100% Community Driven
      </text>
    </g>
  </g>

  <!-- Border Frame Accent -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="url(#primary-glow)" stroke-width="1.5" stroke-opacity="0.5"/>
</svg>
